[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uploadkit-flask"
version = "0.1.0"
description = "Flask integration for UploadKit"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "UploadKit" }]
keywords = ["uploadkit", "flask", "upload"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "uploadkit>=0.2.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
security = ["uploadkit-security>=0.2.0"]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
    "uploadkit-testing>=0.1.0",
    "uploadkit-security>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/uploadkit/uploadkit-flask"
Repository = "https://github.com/uploadkit/uploadkit-flask"

[tool.hatch.build.targets.wheel]
packages = ["src/uploadkit_flask"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
